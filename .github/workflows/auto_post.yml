name: 🚀 Auto Post Every 3 Hours — Redbubble Smart Poster

# ══════════════════════════════════════════════════════════════
# ⏰ مواعيد البوستات (UTC) — كل 3 ساعات
#
#   UTC 00:00 → مصر 02:00 صباحاً
#   UTC 03:00 → مصر 05:00 صباحاً
#   UTC 06:00 → مصر 08:00 صباحاً
#   UTC 09:00 → مصر 11:00 صباحاً
#   UTC 12:00 → مصر 02:00 ظهراً
#   UTC 15:00 → مصر 05:00 مساءً
#   UTC 18:00 → مصر 08:00 مساءً
#   UTC 21:00 → مصر 11:00 مساءً
#
#   (مصر = UTC+2 في الشتاء / UTC+3 في الصيف)
# ══════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0 0 * * *'    # 12:00 AM UTC  →  02:00 AM مصر
    - cron: '0 3 * * *'    # 03:00 AM UTC  →  05:00 AM مصر
    - cron: '0 6 * * *'    # 06:00 AM UTC  →  08:00 AM مصر
    - cron: '0 9 * * *'    # 09:00 AM UTC  →  11:00 AM مصر
    - cron: '0 12 * * *'   # 12:00 PM UTC  →  02:00 PM مصر
    - cron: '0 15 * * *'   # 03:00 PM UTC  →  05:00 PM مصر
    - cron: '0 18 * * *'   # 06:00 PM UTC  →  08:00 PM مصر
    - cron: '0 21 * * *'   # 09:00 PM UTC  →  11:00 PM مصر

  workflow_dispatch:
    inputs:
      redbubble_url:
        description: '🔗 رابط منتج يدوي (فاضي = أوتوماتيك)'
        required: false
        default: ''

      post_type:
        description: '📝 نوع البوست'
        required: false
        default: 'auto'
        type: choice
        options: [auto, album, reels]

      language:
        description: '🌍 لغة الكابشن'
        required: false
        default: 'english'
        type: choice
        options: [english, arabic, both]

      style:
        description: '🎨 أسلوب الكابشن'
        required: false
        default: 'mixed'
        type: choice
        options: [mixed, sales_blast, funny, emotional, hard_sell]

      force_post:
        description: '⚡ نشر حتى لو في cooldown'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  # ════════════════════════════════════════════════════════════
  # 🚀 JOB 1 — البوست الأوتوماتيك
  # ════════════════════════════════════════════════════════════
  smart-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎲 Calculate rotation index
        id: rotation
        run: |
          HOUR=$(date +%-H)
          IDX=$((HOUR / 3))
          # ✅ يتبادل بين album و reels — زوجي=album / فردي=reels
          if [ $((IDX % 2)) -eq 0 ]; then
            POST_TYPE_AUTO="album"
          else
            POST_TYPE_AUTO="reels"
          fi
          echo "index=$IDX"                     >> $GITHUB_OUTPUT
          echo "post_type_auto=$POST_TYPE_AUTO" >> $GITHUB_OUTPUT
          echo "Rotation: $IDX → $POST_TYPE_AUTO (hour=$HOUR)"

      - name: ⚙️ Set environment variables
        id: vars
        run: |
          RB_URL="${{ github.event.inputs.redbubble_url }}"
          POST_T="${{ github.event.inputs.post_type }}"
          LANG="${{ github.event.inputs.language }}"
          STY="${{ github.event.inputs.style }}"
          FORCE="${{ github.event.inputs.force_post }}"

          [ -z "$POST_T" ] && POST_T="auto"
          [ -z "$LANG"   ] && LANG="english"
          [ -z "$STY"    ] && STY="mixed"
          [ -z "$FORCE"  ] && FORCE="false"

          echo "rb_url=$RB_URL"    >> $GITHUB_OUTPUT
          echo "post_type=$POST_T" >> $GITHUB_OUTPUT
          echo "language=$LANG"    >> $GITHUB_OUTPUT
          echo "style=$STY"        >> $GITHUB_OUTPUT
          echo "force=$FORCE"      >> $GITHUB_OUTPUT

          echo "--- Settings ---"
          echo "Trigger  : ${{ github.event_name }}"
          echo "UTC Time : $(date -u '+%H:%M')"
          echo "Egypt    : $(TZ='Africa/Cairo' date '+%H:%M %Z')"
          echo "URL      : ${RB_URL:-'(auto)'}"
          echo "PostType : $POST_T"
          echo "Language : $LANG"
          echo "Style    : $STY"
          echo "Force    : $FORCE"

      - name: 🚀 Run Smart Poster
        env:
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN:              ${{ secrets.FB_TOKEN }}
          INSTAGRAM_USER_ID:     ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN:       ${{ secrets.INSTAGRAM_TOKEN }}
          PINTEREST_TOKEN:       ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID:    ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_USERNAME:    ${{ secrets.PINTEREST_USERNAME }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          BLOGGER_BLOG_ID:       ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID:     ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          REDBUBBLE_STORE_URL:   ${{ secrets.REDBUBBLE_STORE_URL }}
          REDBUBBLE_URL:         ${{ steps.vars.outputs.rb_url }}
          POST_TYPE:             ${{ steps.vars.outputs.post_type == 'auto' && steps.rotation.outputs.post_type_auto || steps.vars.outputs.post_type }}
          LANGUAGE:              ${{ steps.vars.outputs.language }}
          STYLE:                 ${{ steps.vars.outputs.style }}
          MAX_IMAGES:            '30'
          POST_ROTATION_INDEX:   ${{ steps.rotation.outputs.index }}
          IGNORE_DUPLICATES:     ${{ steps.vars.outputs.force }}
        run: python main.py

      - name: 💾 Save history to repository
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add -f designs_history.json 2>/dev/null || true
          git add -f post_history.json    2>/dev/null || true
          git add manual_products.json    2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ No history changes"
          else
            git commit -m "📊 Update history [skip ci]"
            git pull --rebase origin main || git rebase --abort
            git push || (git pull --rebase origin main && git push)
            echo "✅ History saved!"
          fi

      - name: ✅ Summary (Success)
        if: success()
        run: |
          echo "🎉 Posted! Trigger: ${{ github.event_name }}"
          echo "🕐 UTC  : $(date -u '+%Y-%m-%d %H:%M')"
          echo "🕐 Egypt: $(TZ='Africa/Cairo' date '+%Y-%m-%d %H:%M %Z')"
          [ -f designs_history.json ] && python -c "
          import json
          h = json.load(open('designs_history.json'))
          print(f'Total posts   : {h.get(\"total_posts\",0)}')
          print(f'Designs tracked: {len(h.get(\"designs\",{}))}')
          "

      - name: ❌ Summary (Failure)
        if: failure()
        run: |
          echo "⚠️ Failed — Trigger: ${{ github.event_name }}"
          echo "Check FB_TOKEN and secrets in repo settings"

  # ════════════════════════════════════════════════════════════
  # 📋 JOB 2 — تحديث الكتالوج يومياً الساعة 7 UTC (9 مصر)
  # ════════════════════════════════════════════════════════════
  update-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && startsWith(github.event.schedule, '0 7'))

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📋 Update all_designs.json
        env:
          REDBUBBLE_STORE_URL: ${{ secrets.REDBUBBLE_STORE_URL }}
          FB_PAGE_ID:          ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN:            ${{ secrets.FB_TOKEN }}
        run: |
          echo "UTC  : $(date -u '+%Y-%m-%d %H:%M')"
          echo "Egypt: $(TZ='Africa/Cairo' date '+%Y-%m-%d %H:%M %Z')"
          python update_catalog.py

      - name: 💾 Save catalog to repository
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add -f all_designs.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ No catalog changes"
          else
            git commit -m "📋 Daily catalog update [skip ci]"
            git pull --rebase origin main
            git push
            echo "✅ Catalog saved!"
          fi
