name: 🚀 Auto Post Every 3 Hours — Album + Reels

# ══════════════════════════════════════════════════════════════
# ⏰ جدول البوستات — كل 3 ساعات (مصر = UTC+2)
#
#   UTC 00 → مصر 02:00 ص  → Album
#   UTC 03 → مصر 05:00 ص  → Album
#   UTC 06 → مصر 08:00 ص  → Album
#   UTC 09 → مصر 11:00 ص  → Album
#   UTC 12 → مصر 02:00 م  → Album
#   UTC 15 → مصر 05:00 م  → Album
#   UTC 18 → مصر 08:00 م  → Reels ← مرة واحدة في اليوم
#   UTC 21 → مصر 11:00 م  → Album
# ══════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0 0  * * *'   # مصر 02:00 ص → Album
    - cron: '0 3  * * *'   # مصر 05:00 ص → Album
    - cron: '0 6  * * *'   # مصر 08:00 ص → Album
    - cron: '0 9  * * *'   # مصر 11:00 ص → Album
    - cron: '0 12 * * *'   # مصر 02:00 م → Album
    - cron: '0 15 * * *'   # مصر 05:00 م → Album
    - cron: '0 18 * * *'   # مصر 08:00 م → Reels ✅
    - cron: '0 21 * * *'   # مصر 11:00 م → Album

  workflow_dispatch:
    inputs:
      redbubble_url:
        description: '🔗 رابط منتج يدوي (فاضي = أوتوماتيك)'
        required: false
        default: ''

      post_type:
        description: '📝 نوع البوست'
        required: false
        default: 'auto'
        type: choice
        options: [auto, album, reels]

      language:
        description: '🌍 لغة الكابشن'
        required: false
        default: 'english'
        type: choice
        options: [english, arabic, both]

      style:
        description: '🎨 أسلوب الكابشن'
        required: false
        default: 'mixed'
        type: choice
        options: [mixed, sales_blast, funny, emotional, hard_sell]

      force_post:
        description: '⚡ نشر حتى لو في cooldown'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:

  # ════════════════════════════════════════════════════════════
  # 🔄 JOB 0 — Keep-alive (يمنع GitHub من إيقاف الـ schedule)
  # ════════════════════════════════════════════════════════════
  keep-alive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔄 Keep workflow active
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          echo "$(date -u)" > .github/keepalive
          git add .github/keepalive
          git diff --staged --quiet || (git commit -m "🔄 Keep-alive [skip ci]" && git push)

  # ════════════════════════════════════════════════════════════
  # 📋 JOB 1 — تحديث الكتالوج
  # ════════════════════════════════════════════════════════════
  update-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [keep-alive]
    if: always()

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📋 Update all_designs.json
        env:
          REDBUBBLE_STORE_URL: ${{ secrets.REDBUBBLE_STORE_URL }}
          FB_PAGE_ID:          ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN:            ${{ secrets.FB_TOKEN }}
        run: |
          echo "UTC  : $(date -u '+%Y-%m-%d %H:%M')"
          echo "Egypt: $(TZ='Africa/Cairo' date '+%Y-%m-%d %H:%M %Z')"
          python update_catalog.py

      - name: 💾 Save catalog
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add -f all_designs.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ No catalog changes"
          else
            git commit -m "📋 Catalog update [skip ci]"
            git pull --rebase -X ours origin main && git push && echo "✅ Saved!"
          fi

  # ════════════════════════════════════════════════════════════
  # 🚀 JOB 2 — البوست الذكي
  # ════════════════════════════════════════════════════════════
  smart-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: update-catalog
    if: always()

    steps:
      - name: 🕐 Detect post mode
        id: mode
        run: |
          UTC_HOUR=$(date -u +%-H)

          # UTC 18 = مصر 8م = Reels
          # كل الساعات التانية = Album
          if [ "$UTC_HOUR" -eq 18 ]; then
            AUTO_MODE="reels"
          else
            AUTO_MODE="album"
          fi

          echo "utc_hour=$UTC_HOUR"     >> $GITHUB_OUTPUT
          echo "auto_mode=$AUTO_MODE"   >> $GITHUB_OUTPUT
          echo "🕐 UTC=$UTC_HOUR | Mode=$AUTO_MODE"

      - name: ⏳ Wait 3 seconds
        run: sleep 3

      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 📦 Restore today_design cache
        uses: actions/cache@v4
        with:
          path: today_design.json
          key: today-design-${{ github.run_id }}
          restore-keys: |
            today-design-

      - name: 📦 Restore post history cache
        uses: actions/cache@v4
        with:
          path: post_history.json
          key: post-history-${{ github.run_id }}
          restore-keys: |
            post-history-

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Set variables
        id: vars
        run: |
          POST_T="${{ github.event.inputs.post_type }}"
          LANG="${{ github.event.inputs.language }}"
          STY="${{ github.event.inputs.style }}"
          FORCE="${{ github.event.inputs.force_post }}"
          RB_URL="${{ github.event.inputs.redbubble_url }}"

          [ -z "$POST_T" ] && POST_T="auto"
          [ -z "$LANG"   ] && LANG="english"
          [ -z "$STY"    ] && STY="mixed"
          [ -z "$FORCE"  ] && FORCE="false"

          # لو auto → استخدم المود المحسوب
          if [ "$POST_T" = "auto" ]; then
            FINAL_TYPE="${{ steps.mode.outputs.auto_mode }}"
          else
            FINAL_TYPE="$POST_T"
          fi

          echo "rb_url=$RB_URL"         >> $GITHUB_OUTPUT
          echo "post_type=$FINAL_TYPE"  >> $GITHUB_OUTPUT
          echo "language=$LANG"         >> $GITHUB_OUTPUT
          echo "style=$STY"             >> $GITHUB_OUTPUT
          echo "force=$FORCE"           >> $GITHUB_OUTPUT

          echo "--- Settings ---"
          echo "Trigger  : ${{ github.event_name }}"
          echo "UTC      : $(date -u '+%H:%M')"
          echo "Egypt    : $(TZ='Africa/Cairo' date '+%H:%M %Z')"
          echo "Mode     : $FINAL_TYPE"
          echo "URL      : ${RB_URL:-'(auto)'}"

      - name: 🚀 Run Smart Poster
        env:
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN:              ${{ secrets.FB_TOKEN }}
          INSTAGRAM_USER_ID:     ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN:       ${{ secrets.INSTAGRAM_TOKEN }}
          PINTEREST_TOKEN:       ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID:    ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_USERNAME:    ${{ secrets.PINTEREST_USERNAME }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          BLOGGER_BLOG_ID:       ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID:     ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          REDBUBBLE_STORE_URL:   ${{ secrets.REDBUBBLE_STORE_URL }}
          REDBUBBLE_URL:         ${{ steps.vars.outputs.rb_url }}
          POST_TYPE:             ${{ steps.vars.outputs.post_type }}
          LANGUAGE:              ${{ steps.vars.outputs.language }}
          STYLE:                 ${{ steps.vars.outputs.style }}
          MAX_IMAGES:            '30'
          IGNORE_DUPLICATES:     ${{ steps.vars.outputs.force }}
        run: python main.py

      - name: 💾 Save history & today_design
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add -f designs_history.json 2>/dev/null || true
          git add -f post_history.json    2>/dev/null || true
          git add -f today_design.json    2>/dev/null || true
          git add manual_products.json    2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ No changes"
          else
            git commit -m "📊 Update history [skip ci]"
            for i in 1 2 3; do
              git pull --rebase -X ours origin main && git push && echo "✅ Saved!" && break
              echo "⚠️ Retry $i..."
              git rebase --abort 2>/dev/null || true
              git checkout --ours designs_history.json post_history.json today_design.json 2>/dev/null || true
              git add -f designs_history.json post_history.json today_design.json 2>/dev/null || true
              sleep 3
            done
          fi

      - name: ✅ Summary
        if: success()
        run: |
          echo "🎉 Done! Mode: ${{ steps.vars.outputs.post_type }}"
          echo "🕐 UTC  : $(date -u '+%Y-%m-%d %H:%M')"
          echo "🕐 Egypt: $(TZ='Africa/Cairo' date '+%Y-%m-%d %H:%M %Z')"

      - name: ❌ Failure
        if: failure()
        run: echo "⚠️ Failed! Check secrets and logs above."
