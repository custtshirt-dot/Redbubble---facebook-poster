name: Auto Post Every 3 Hours

on:
  schedule:
    - cron: '0 0  * * *'
    - cron: '0 3  * * *'
    - cron: '0 6  * * *'
    - cron: '0 9  * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
    - cron: '0 21 * * *'

  workflow_dispatch:
    inputs:
      redbubble_url:
        description: 'رابط منتج يدوي (فاضي = اوتوماتيك)'
        required: false
        default: ''
      post_type:
        description: 'نوع البوست'
        required: false
        default: 'auto'
        type: choice
        options: [auto, album, reels]
      language:
        description: 'لغة الكابشن'
        required: false
        default: 'english'
        type: choice
        options: [english, arabic, both]
      style:
        description: 'اسلوب الكابشن'
        required: false
        default: 'mixed'
        type: choice
        options: [mixed, sales_blast, funny, emotional, hard_sell]
      force_post:
        description: 'نشر حتى لو في cooldown'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:

  # ══════════════════════════════════════════════════
  # JOB 1 — Keep-alive (مستقل تماماً — مش بيأثر على البوست)
  # ══════════════════════════════════════════════════
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push keep-alive commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          mkdir -p .github
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/keepalive
          git add .github/keepalive
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "keepalive $(date -u '+%Y-%m-%d %H:%M') [skip ci]"
          git push || true

  # ══════════════════════════════════════════════════
  # JOB 2 — تحديث الكتالوج (مستقل)
  # ══════════════════════════════════════════════════
  update-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update catalog
        env:
          REDBUBBLE_STORE_URL: ${{ secrets.REDBUBBLE_STORE_URL }}
          FB_PAGE_ID:          ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN:            ${{ secrets.FB_TOKEN }}
        run: |
          echo "UTC  : $(date -u '+%Y-%m-%d %H:%M')"
          echo "Egypt: $(TZ='Africa/Cairo' date '+%Y-%m-%d %H:%M')"
          python update_catalog.py

      - name: Save catalog to repo
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add -f all_designs.json 2>/dev/null || true
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "catalog update [skip ci]"
          git pull --rebase -X ours origin main && git push && echo "saved"

  # ══════════════════════════════════════════════════
  # JOB 3 — البوست الرئيسي (يشتغل بعد الكتالوج)
  # ══════════════════════════════════════════════════
  smart-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # مستقل تماماً — بيشتغل بالتوازي مع update-catalog بدون انتظار

    steps:
      - name: Detect post mode
        id: mode
        run: |
          UTC_HOUR=$(date -u +%-H)
          if [ "$UTC_HOUR" -eq 18 ]; then
            MODE="reels"
          else
            MODE="album"
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "UTC=$UTC_HOUR | Egypt=$(( (UTC_HOUR+2)%24 )):00 | Mode=$MODE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore today_design cache
        uses: actions/cache@v4
        with:
          path: today_design.json
          key: today-design-${{ github.run_id }}
          restore-keys: today-design-

      - name: Restore post history cache
        uses: actions/cache@v4
        with:
          path: post_history.json
          key: post-history-${{ github.run_id }}
          restore-keys: post-history-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set post variables
        id: vars
        run: |
          POST_T="${{ github.event.inputs.post_type }}"
          [ -z "$POST_T" ] || [ "$POST_T" = "auto" ] && POST_T="${{ steps.mode.outputs.mode }}"

          LANG="${{ github.event.inputs.language }}"
          [ -z "$LANG" ] && LANG="english"

          STY="${{ github.event.inputs.style }}"
          [ -z "$STY" ] && STY="mixed"

          FORCE="${{ github.event.inputs.force_post }}"
          [ -z "$FORCE" ] && FORCE="false"

          RB_URL="${{ github.event.inputs.redbubble_url }}"

          echo "post_type=$POST_T" >> $GITHUB_OUTPUT
          echo "language=$LANG"    >> $GITHUB_OUTPUT
          echo "style=$STY"        >> $GITHUB_OUTPUT
          echo "force=$FORCE"      >> $GITHUB_OUTPUT
          echo "rb_url=$RB_URL"    >> $GITHUB_OUTPUT

          echo "Mode=$POST_T | Lang=$LANG | Style=$STY | Force=$FORCE"

      - name: Run poster
        env:
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN:              ${{ secrets.FB_TOKEN }}
          INSTAGRAM_USER_ID:     ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN:       ${{ secrets.INSTAGRAM_TOKEN }}
          PINTEREST_TOKEN:       ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID:    ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_USERNAME:    ${{ secrets.PINTEREST_USERNAME }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          BLOGGER_BLOG_ID:       ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID:     ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          REDBUBBLE_STORE_URL:   ${{ secrets.REDBUBBLE_STORE_URL }}
          REDBUBBLE_URL:         ${{ steps.vars.outputs.rb_url }}
          POST_TYPE:             ${{ steps.vars.outputs.post_type }}
          LANGUAGE:              ${{ steps.vars.outputs.language }}
          STYLE:                 ${{ steps.vars.outputs.style }}
          MAX_IMAGES:            '30'
          IGNORE_DUPLICATES:     ${{ steps.vars.outputs.force }}
        run: python main.py

      - name: Save history
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add -f designs_history.json post_history.json today_design.json 2>/dev/null || true
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "history update [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X ours origin main && git push && echo "saved!" && break
            sleep 3
            git rebase --abort 2>/dev/null || true
          done
