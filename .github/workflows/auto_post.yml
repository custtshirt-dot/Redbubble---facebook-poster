name: 🚀 Auto Post Every 3 Hours — Redbubble Smart Poster

on:
  # ── تشغيل أوتوماتيك كل 3 ساعات ──
  schedule:
    - cron: '0 */3 * * *'

  # ── تشغيل يدوي مع خيارات ──
  workflow_dispatch:
    inputs:
      redbubble_url:
        description: '🔗 رابط منتج يدوي (اتركه فاضي = يسكان الستور أوتوماتيك)'
        required: false
        default: ''

      post_type:
        description: '📝 نوع البوست'
        required: false
        default: 'auto'
        type: choice
        options: [auto, album, single, link, video, reels, text, all]

      language:
        description: '🌍 لغة الكابشن'
        required: false
        default: 'english'
        type: choice
        options: [english, arabic, both]

      style:
        description: '🎨 أسلوب الكابشن'
        required: false
        default: 'mixed'
        type: choice
        options: [funny, emotional, hard_sell, mixed]

      force_post:
        description: '⚡ نشر حتى لو اتنشر مؤخراً'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  smart-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎲 Calculate rotation index
        id: rotation
        run: |
          HOUR=$(date +%-H)
          IDX=$((HOUR / 3))
          echo "index=$IDX" >> $GITHUB_OUTPUT
          echo "Rotation index: $IDX (hour=$HOUR)"

      # تحديد المتغيرات بأمان للحالتين scheduled و manual
      - name: ⚙️ Set environment variables
        id: vars
        run: |
          RB_URL="${{ github.event.inputs.redbubble_url }}"
          POST_T="${{ github.event.inputs.post_type }}"
          LANG="${{ github.event.inputs.language }}"
          STY="${{ github.event.inputs.style }}"
          FORCE="${{ github.event.inputs.force_post }}"

          [ -z "$POST_T" ] && POST_T="auto"
          [ -z "$LANG"   ] && LANG="english"
          [ -z "$STY"    ] && STY="mixed"
          [ -z "$FORCE"  ] && FORCE="false"

          echo "rb_url=$RB_URL"    >> $GITHUB_OUTPUT
          echo "post_type=$POST_T" >> $GITHUB_OUTPUT
          echo "language=$LANG"    >> $GITHUB_OUTPUT
          echo "style=$STY"        >> $GITHUB_OUTPUT
          echo "force=$FORCE"      >> $GITHUB_OUTPUT

          echo "--- Settings ---"
          echo "Trigger  : ${{ github.event_name }}"
          echo "URL      : ${RB_URL:-'(empty — will scan store)'}"
          echo "PostType : $POST_T"
          echo "Language : $LANG"
          echo "Style    : $STY"
          echo "Force    : $FORCE"

      - name: 🚀 Run Smart Poster
        env:
          FB_PAGE_ID:          ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN:            ${{ secrets.FB_TOKEN }}
          INSTAGRAM_USER_ID:   ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN:     ${{ secrets.INSTAGRAM_TOKEN }}
          PINTEREST_TOKEN:     ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID:  ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_USERNAME:  ${{ secrets.PINTEREST_USERNAME }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          REDBUBBLE_STORE_URL: ${{ secrets.REDBUBBLE_STORE_URL }}
          REDBUBBLE_URL:       ${{ steps.vars.outputs.rb_url }}
          POST_TYPE:           ${{ steps.vars.outputs.post_type }}
          LANGUAGE:            ${{ steps.vars.outputs.language }}
          STYLE:               ${{ steps.vars.outputs.style }}
          MAX_IMAGES:          '30'
          POST_ROTATION_INDEX: ${{ steps.rotation.outputs.index }}
          IGNORE_DUPLICATES:   ${{ steps.vars.outputs.force }}
        run: python main.py

      - name: 💾 Save history to repository
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add designs_history.json 2>/dev/null || true
          git add post_history.json    2>/dev/null || true
          git add manual_products.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ No history changes"
          else
            git commit -m "📊 Update history [skip ci]"
            git push
            echo "✅ History saved!"
          fi

      - name: ✅ Summary (Success)
        if: success()
        run: |
          echo "🎉 Posted! Trigger: ${{ github.event_name }}"
          [ -f designs_history.json ] && python -c "
          import json
          h = json.load(open('designs_history.json'))
          print(f'Total posts: {h.get(chr(116)+chr(111)+chr(116)+chr(97)+chr(108)+chr(95)+chr(112)+chr(111)+chr(115)+chr(116)+chr(115),0)}')
          print(f'Designs: {len(h.get(chr(100)+chr(101)+chr(115)+chr(105)+chr(103)+chr(110)+chr(115),{}))}')
          "

      - name: ❌ Summary (Failure)
        if: failure()
        run: |
          echo "⚠️ Failed. Trigger: ${{ github.event_name }}"
          echo "Check FB_TOKEN and REDBUBBLE_STORE_URL in Secrets"
