name: 🚀 Auto Post to Facebook + Instagram + Pinterest

on:
  workflow_dispatch:
    inputs:
      redbubble_url:
        description: '🔗 Redbubble Collection URL'
        required: true
        type: string
        default: ''

      post_type:
        description: '📝 Post Type'
        required: true
        type: choice
        default: 'album'
        options:
          - album
          - single
          - carousel
          - reels
          - video
          - text
          - link
          - all

      max_images:
        description: '📸 Max Images (1-30)'
        required: false
        type: string
        default: '10'

      language:
        description: '🌍 Caption Language'
        required: true
        type: choice
        default: 'english'
        options:
          - english
          - arabic
          - both

      style:
        description: '🎨 Caption Style'
        required: true
        type: choice
        default: 'mixed'
        options:
          - funny
          - emotional
          - hard_sell
          - mixed

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run the bot
        env:
          # 🔒 Facebook
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}

          # 🔒 Instagram
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}

          # 🔒 Pinterest
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_USERNAME: ${{ secrets.PINTEREST_USERNAME }}

          # 🔒 AI
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          # 📝 Inputs
          REDBUBBLE_URL: ${{ inputs.redbubble_url }}
          POST_TYPE: ${{ inputs.post_type }}
          MAX_IMAGES: ${{ inputs.max_images }}
          LANGUAGE: ${{ inputs.language }}
          STYLE: ${{ inputs.style }}

        run: python main.py

      - name: ✅ Success
        if: success()
        run: echo "🎉 Posted to Facebook + Instagram + Pinterest!"

      - name: ❌ Failure
        if: failure()
        run: echo "⚠️ Something went wrong. Check logs above."
